name: project_ops
description: تطبيق متجر إلكتروني بواجهة عربية RTL
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0

  # Storage
  flutter_secure_storage: ^9.2.2

  # UI Components
  cached_network_image: ^3.3.1
  intl: ^0.20.2

  # Utils
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0

  # Firebase & Google Auth
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/