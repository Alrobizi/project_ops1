    // ==========================================
    // Barakat Aden API Client (Laravel Backend)
    // ==========================================
    const BarakatApi = {
      getBaseUrl() {
        return localStorage.getItem('barakat_api_url') || 'http://127.0.0.1:8009/api';
      },
      setBaseUrl(url) {
        const clean = url.trim().replace(/\/+$/, '');
        localStorage.setItem('barakat_api_url', clean);
        return clean;
      },
      getToken() {
        return localStorage.getItem('barakat_admin_token') || '';
      },
      setToken(token) {
        if (token) localStorage.setItem('barakat_admin_token', token);
        else localStorage.removeItem('barakat_admin_token');
      },
      async request(endpoint, options = {}) {
        const baseUrl = this.getBaseUrl();
        const token = this.getToken();
        const headers = {
          'Accept': 'application/json',
          'Content-Type': 'application/json',
          ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
          ...(options.headers || {})
        };
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 7000);

        try {
          const res = await fetch(`${baseUrl}${endpoint}`, {
            ...options,
            headers,
            signal: controller.signal
          });
          clearTimeout(timeoutId);
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            const err = new Error(data.message || `خطأ ${res.status}: فشل الاستجابة`);
            err.status = res.status;
            err.data = data;
            throw err;
          }
          return data;
        } catch (err) {
          clearTimeout(timeoutId);
          if (err.name === 'AbortError') {
            throw new Error('انتهت مهلة الاتصال بالخادم (تأكد من تشغيل السيرفر php artisan serve)');
          }
          throw err;
        }
      },
      async login(email, password) {
        const res = await this.request('/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        if (res.data?.token) {
          this.setToken(res.data.token);
          if (res.data.user) {
            localStorage.setItem('barakat_admin_user', JSON.stringify(res.data.user));
          }
        }
        return res;
      },
      async getDashboard() {
        return this.request('/admin/dashboard');
      },
      async getOrders(status = 'all') {
        const query = status && status !== 'all' ? `?status=${encodeURIComponent(status)}` : '';
        return this.request(`/admin/orders${query}`);
      },
      async updateOrderStatus(id, status) {
        return this.request(`/admin/orders/${id}/status`, {
          method: 'PATCH',
          body: JSON.stringify({ status })
        });
      },
      async getProducts(params = {}) {
        const q = new URLSearchParams(params).toString();
        return this.request(`/admin/products${q ? `?${q}` : ''}`);
      },
      async storeProduct(data) {
        return this.request('/admin/products', {
          method: 'POST',
          body: JSON.stringify(data)
        });
      },
      async updateProduct(id, data) {
        return this.request(`/admin/products/${id}`, {
          method: 'PUT',
          body: JSON.stringify(data)
        });
      },
      async deleteProduct(id) {
        return this.request(`/admin/products/${id}`, {
          method: 'DELETE'
        });
      },
      async getCustomers() {
        return this.request('/admin/customers');
      },
      async toggleCustomer(id) {
        return this.request(`/admin/customers/${id}/toggle`, {
          method: 'PATCH'
        });
      },
      async getSettings() {
        return this.request('/settings');
      },
      async updateSettings(data) {
        return this.request('/admin/settings', {
          method: 'PUT',
          body: JSON.stringify(data)
        });
      },
      async getCategories() {
        return this.request('/admin/categories');
      },
      async getDiscounts() {
        return this.request('/admin/discounts');
      },
      logout() {
        this.setToken('');
        localStorage.removeItem('barakat_admin_user');
      }
    };

    // ==========================================
    // Mini Sparkline SVG Generator
    // ==========================================
    const Sparkline = ({ points, color = "#6D5DF6", fill = "rgba(109, 93, 246, 0.12)" }) => {
      const min = Math.min(...points);
      const max = Math.max(...points) || 1;
      const height = 36;
      const width = 110;
      const step = width / (points.length - 1);

      const coords = points.map((p, i) => {
        const x = i * step;
        const y = height - ((p - min) / (max - min || 1)) * (height - 8) - 4;
        return `${x},${y}`;
      });

      const pathData = coords.reduce((acc, curr, i) => {
        if (i === 0) return `M ${curr}`;
        const prev = coords[i - 1].split(',');
        const cur = curr.split(',');
        const midX = (parseFloat(prev[0]) + parseFloat(cur[0])) / 2;
        return `${acc} C ${midX},${prev[1]} ${midX},${cur[1]} ${cur[0]},${cur[1]}`;
      }, "");

      const areaData = `${pathData} L ${width},${height} L 0,${height} Z`;

      return (
        <svg width={width} height={height} className="overflow-visible">
          <path d={areaData} fill={fill} />
          <path d={pathData} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" />
        </svg>
      );
    };

    const OrderStatusDonut = ({ orders }) => {
      const stats = useMemo(() => {

        const total = Object.values(counts).reduce((a, b) => a + b, 0);
        return { counts, total };
      }, [orders]);

      const slices = [
        { key: "processing", label: "قيد المعالجة", count: stats.counts.processing, color: "#F59E0B" },
        { key: "shipped", label: "قيد الشحن", count: stats.counts.shipped, color: "#3B82F6" },
        { key: "delivered", label: "مكتمل", count: stats.counts.delivered, color: "#10B981" },
        { key: "cancelled", label: "ملغي", count: stats.counts.cancelled, color: "#EF4444" },
      ];

      // SVG Donut calculations
      const size = 180;
      const strokeWidth = 22;
      const radius = (size - strokeWidth) / 2;
      const circumference = 2 * Math.PI * radius;
      let cumulativeOffset = 0;

      return (
        <div className="flex flex-col sm:flex-row items-center justify-between gap-6">
          <div className="relative w-44 h-44 flex items-center justify-center flex-shrink-0">
            <svg width={size} height={size} className="transform -rotate-90">
              <circle
                cx={size / 2}
                cy={size / 2}
                r={radius}
                fill="transparent"
                stroke="currentColor"
                strokeWidth={strokeWidth}
                className="text-slate-100 dark:text-slate-800"
              />
              {slices.map((slice, i) => {
                const percent = slice.count / (stats.total || 1);
                const strokeDasharray = `${circumference * percent} ${circumference * (1 - percent)}`;
                const strokeDashoffset = -cumulativeOffset;
                cumulativeOffset += circumference * percent;

                if (slice.count === 0) return null;

                return (
                  <circle
                    key={i}
                    cx={size / 2}
                    cy={size / 2}
                    r={radius}
                    fill="transparent"
                    stroke={slice.color}
                    strokeWidth={strokeWidth}
                    strokeDasharray={strokeDasharray}
                    strokeDashoffset={strokeDashoffset}
                    strokeLinecap="round"
                    className="transition-all duration-500 hover:opacity-80 cursor-pointer"
                  />
                );
              })}
            </svg>
            <div className="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none">
              <span className="text-2xl font-black text-slate-800 dark:text-slate-100 font-mono">
                {stats.total}
              </span>
              <span className="text-xs font-semibold text-slate-400">إجمالي الطلبات</span>
            </div>
          </div>

          <div className="flex-1 w-full space-y-2.5">
            {slices.map((slice, i) => {
              const pct = Math.round((slice.count / (stats.total || 1)) * 100);
              return (
                <div key={i} className="flex items-center justify-between text-xs p-1.5 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
                  <div className="flex items-center gap-2">
                    <span className="w-3 h-3 rounded-full flex-shrink-0" style={{ backgroundColor: slice.color }}></span>
                    <span className="font-medium text-slate-600 dark:text-slate-300">{slice.label}</span>

    const Toast = ({ message, type = "success", onClose }) => {
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        if (message) {
          setVisible(true);
        } else {
          setVisible(false);
        }
      }, [message]);

      if (!message) return null;

      const config = {
        success: { bg: "bg-emerald-500", icon: "CheckCircle2", border: "border-emerald-400" },
        error:   { bg: "bg-rose-500",    icon: "AlertCircle",  border: "border-rose-400" },
        info:    { bg: "bg-blue-500",    icon: "Bell",         border: "border-blue-400" },
      };
      const c = config[type] || config.success;

      return (
        <div
          className={`fixed bottom-6 left-1/2 z-[100] -translate-x-1/2 flex items-center gap-3 px-5 py-3 rounded-2xl shadow-2xl border ${c.bg} ${c.border} text-white transition-all duration-500 ${visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'}`}
          style={{ minWidth: 280, maxWidth: 400 }}
        >
          <Icon name={c.icon} size={20} className="flex-shrink-0" />
          <span className="text-sm font-semibold flex-1">{message}</span>
          <button onClick={onClose} className="opacity-70 hover:opacity-100 transition-opacity">

      );

          const matchCat = categoryFilter === "all" || p.category === categoryFilter;
          const matchStock = stockFilter === "all" ||
            (stockFilter === "in_stock" && p.stock >= 10) ||
            (stockFilter === "low_stock" && p.stock > 0 && p.stock < 10) ||
            (stockFilter === "out_of_stock" && p.stock === 0);
          return matchSearch && matchCat && matchStock;
        });

        );
        setModalOpen(true);

        e.preventDefault();

          ...formData,

          old_price: formData.old_price ? parseFloat(formData.old_price) : null,
          stock: parseInt(formData.stock) || 0,

                        <tr
                          key={product.id}
                          className="hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition-colors group cursor-pointer"
                          onClick={() => handleOpenModal(product)}
                        >
                          {/* Image & Title */}
                          <td className="py-3.5 pr-5">
                            <div className="flex items-center gap-3">
                              <img
                                src={product.image}
                                alt={product.name}
                                className="w-12 h-12 rounded-2xl object-cover border border-slate-100 dark:border-slate-800 shadow-sm flex-shrink-0"
                              />
                              <div>
                                <p className="font-bold text-slate-800 dark:text-slate-100 group-hover:text-brand-500 transition-colors">
                                  {product.name}
                                </p>
                                <div className="flex items-center gap-2 mt-0.5">
                                  <span className="text-[10px] text-amber-500 font-bold flex items-center gap-0.5">
                                    ★ {product.rating || "4.8"}
                                  </span>
                                  <span className="text-[10px] text-slate-400">({product.reviews_count || 0} تقييم)</span>
                                </div>
                              </div>
                            </div>
                          </td>

                          {/* Category */}
                          <td className="py-3.5">
                            <span className="inline-block px-2.5 py-1 rounded-xl text-[11px] font-semibold bg-brand-50 dark:bg-brand-950/40 text-brand-600 dark:text-brand-400 border border-brand-100 dark:border-brand-900/40">
                              {product.category || "عام"}
                            </span>
                          </td>

                          {/* Price */}
                          <td className="py-3.5 font-mono font-bold">
                            <div className="flex items-baseline gap-1.5">
                              <span className="text-slate-900 dark:text-slate-100 text-sm">
                                {product.price.toLocaleString()}
                              </span>
                              <span className="text-[10px] text-slate-400 font-sans">ر.س</span>
                              {product.old_price && (
                                <span className="text-[11px] text-slate-400 line-through">
                                  {product.old_price.toLocaleString()}
                                </span>
                              )}
                            </div>
                          </td>

                          {/* Stock */}
                          <td className="py-3.5">
                            <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold ${
                              isOut
                                ? "bg-rose-50 dark:bg-rose-950/40 text-rose-600 border border-rose-200 dark:border-rose-800/40"
                                : isLow
                                ? "bg-amber-50 dark:bg-amber-950/40 text-amber-600 border border-amber-200 dark:border-amber-800/40"
                                : "bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 border border-emerald-200 dark:border-emerald-800/40"
                            }`}>
                              <span className={`w-1.5 h-1.5 rounded-full ${isOut ? "bg-rose-500" : isLow ? "bg-amber-500" : "bg-emerald-500"}`}></span>
                              {isOut ? "نافد" : isLow ? `${product.stock} فقط` : `${product.stock} متوفر`}
                            </span>
                          </td>

                          {/* Active Status Toggle */}
                          <td className="py-3.5">
                            <button
                              onClick={(e) => handleToggleActive(product.id, e)}
                              className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-2xl text-[11px] font-bold transition-all ${
                                product.is_active
                                  ? "bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800/40"
                                  : "bg-slate-100 dark:bg-slate-800 text-slate-400 border border-slate-200 dark:border-slate-700"
                              }`}
                              title="انقر لتغيير حالة العرض"
                            >
                              <Icon name={product.is_active ? "ToggleRight" : "ToggleLeft"} size={16} />
                              <span>{product.is_active ? "معروض للبيع" : "معطل"}</span>
                            </button>
                          </td>

                          {/* Actions */}
                          <td className="py-3.5 pl-5 text-left">
                            <div className="flex items-center justify-end gap-1.5">
                              <button
                                onClick={(e) => {
                                  e.stopPropagation();
                                  handleOpenModal(product);
                                }}
                                className="p-2 rounded-xl text-slate-500 hover:text-brand-500 hover:bg-brand-50 dark:hover:bg-brand-950 transition-colors"
                                title="تعديل المنتج"
                              >
                                <Icon name="Edit" size={15} />
                              </button>
                              <button
                                onClick={(e) => handleDelete(product.id, e)}
                                className="p-2 rounded-xl text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950 transition-colors"
                                title="حذف المنتج"
                              >
                                <Icon name="Trash2" size={15} />
                              </button>
                            </div>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {/* ADD / EDIT PRODUCT MODAL */}
          {modalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
              <div className="bg-white dark:bg-[#131B2E] rounded-3xl max-w-lg w-full border border-slate-100 dark:border-[#1F293D] shadow-2xl p-6 relative">
                <div className="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800">
                  <h3 className="text-base font-bold text-slate-800 dark:text-slate-100">
                    {editingProduct ? "تعديل بيانات المنتج" : "إضافة منتج جديد للمتجر"}
                  </h3>
                  <button onClick={() => setModalOpen(false)} className="p-1 rounded-xl text-slate-400 hover:text-slate-600">
                    <Icon name="X" size={18} />
                  </button>
                </div>

                <form onSubmit={handleSave} className="mt-4 space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">اسم المنتج</label>
                    <input
                      type="text"
                      required
                      value={formData.name}
                      onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                      placeholder="مثال: فستان سهرة مخملي فاخر"
                      className="w-full bg-[#F6F7FB] dark:bg-[#0B0F19] text-xs font-medium text-slate-800 dark:text-slate-200 py-2.5 px-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 focus:outline-none focus:border-brand-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">التصنيف</label>
                      <select
                        value={formData.category}
                        onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                        className="w-full bg-[#F6F7FB] dark:bg-[#0B0F19] text-xs font-medium text-slate-800 dark:text-slate-200 py-2.5 px-3 rounded-2xl border border-slate-200 dark:border-slate-800 focus:outline-none"
                      >
                        {categories.map(c => (
                          <option key={c.id} value={c.name}>{c.name}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">الكمية بالمخزون</label>
                      <input
                        type="number"
                        min="0"
                        value={formData.stock}
                        onChange={(e) => setFormData({ ...formData, stock: e.target.value })}
                        className="w-full bg-[#F6F7FB] dark:bg-[#0B0F19] text-xs font-medium text-slate-800 dark:text-slate-200 py-2.5 px-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">السعر (ر.س)</label>
                      <input
                        type="number"
                        required
                        min="0"
                        step="0.01"
                        value={formData.price}
                        onChange={(e) => setFormData({ ...formData, price: e.target.value })}
                        placeholder="299"
                        className="w-full bg-[#F6F7FB] dark:bg-[#0B0F19] text-xs font-medium text-slate-800 dark:text-slate-200 py-2.5 px-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">السعر القديم (اختياري)</label>
                      <input
                        type="number"
                        min="0"
                        step="0.01"
                        value={formData.old_price}
                        onChange={(e) => setFormData({ ...formData, old_price: e.target.value })}
                        placeholder="399"
                        className="w-full bg-[#F6F7FB] dark:bg-[#0B0F19] text-xs font-medium text-slate-800 dark:text-slate-200 py-2.5 px-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">رابط صورة المنتج (URL)</label>
                    <input
                      type="url"
                      value={formData.image}
                      onChange={(e) => setFormData({ ...formData, image: e.target.value })}
                      placeholder="https://..."
                      className="w-full bg-[#F6F7FB] dark:bg-[#0B0F19] text-xs font-medium text-slate-800 dark:text-slate-200 py-2.5 px-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 focus:outline-none"
                    />
                  </div>

                  <div className="flex items-center gap-2 pt-2">
                    <input
                      type="checkbox"
                      id="is_active_check"
                      checked={formData.is_active}
                      onChange={(e) => setFormData({ ...formData, is_active: e.target.checked })}
                      className="rounded border-slate-300 text-brand-500 focus:ring-brand-500"
                    />
                    <label htmlFor="is_active_check" className="text-xs font-bold text-slate-700 dark:text-slate-200 cursor-pointer">
                      عرض المنتج فوراً في المتجر (نشط)
                    </label>
                  </div>

                  <div className="flex gap-2 pt-3 border-t border-slate-100 dark:border-slate-800">
                    <button
                      type="submit"
                      className="flex-1 py-3 rounded-2xl text-xs font-bold text-white bg-brand-500 hover:bg-brand-600 transition-colors shadow-soft"
                    >
                      {editingProduct ? "حفظ التعديلات" : "إضافة المنتج"}
                    </button>
                    <button
                      type="button"
                      onClick={() => setModalOpen(false)}
                      className="px-4 py-3 rounded-2xl text-xs font-bold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 transition-colors"

                      إلغاء

          )}

      );
    };

    // ==========================================
    // 2. USERS & CUSTOMERS VIEW (المستخدمون والعملاء)
    // ==========================================
    const UsersView = ({ customers, setCustomers, showToast }) => {
      const [searchQuery, setSearchQuery] = useState("");
      const [roleFilter, setRoleFilter] = useState("all");

      const filteredCustomers = useMemo(() => {
        return customers.filter(c => {
          const matchSearch = c.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.email.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (c.phone && c.phone.includes(searchQuery));
          const matchRole = roleFilter === "all" || c.role === roleFilter;
          return matchSearch && matchRole;
        });
      }, [customers, searchQuery, roleFilter]);

      const handleToggleUserStatus = (id) => {
        setCustomers(prev => prev.map(c => {
          if (c.id === id) {
            const nextStatus = !c.is_active;
            showToast(`تم ${nextStatus ? 'تفعيل' : 'إيقاف'} حساب ${c.name} 🟢`);
            return { ...c, is_active: nextStatus };
          }
          return c;
        }));
      };

      const totalUsers = customers.length;
      const totalVip = customers.filter(c => c.is_vip || c.total_spent > 5000).length;
      const totalAdmins = customers.filter(c => c.role === 'admin').length;
      const totalOrdersAll = customers.reduce((sum, c) => sum + (c.orders_count || 0), 0);

      return (
        <div className="space-y-6 animate-fadeIn">
          {/* HEADER */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl sm:text-3xl font-black text-slate-800 dark:text-slate-100 tracking-tight flex items-center gap-2.5">
                <span className="p-2 rounded-2xl bg-brand-500 text-white shadow-soft">
                  <Icon name="Users" size={24} />
                </span>
                إدارة المستخدمين والعملاء
              </h2>
              <p className="text-xs text-slate-400 font-medium mt-1">
                سجل حسابات العملاء والمدراء، ومتابعة النشاط وإجمالي المشتريات
              </p>
            </div>
          </div>

          {/* KPIS */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div className="bg-white dark:bg-[#131B2E] p-4 rounded-3xl border border-slate-100 dark:border-[#1F293D] shadow-sm">
              <span className="text-xs font-bold text-slate-400">إجمالي الحسابات</span>
              <div className="text-2xl font-black text-slate-800 dark:text-slate-100 font-mono mt-1">{totalUsers}</div>
            </div>
            <div className="bg-white dark:bg-[#131B2E] p-4 rounded-3xl border border-slate-100 dark:border-[#1F293D] shadow-sm">
              <span className="text-xs font-bold text-purple-500">عملاء VIP المميزون</span>
              <div className="text-2xl font-black text-purple-600 font-mono mt-1">{totalVip}</div>
            </div>
            <div className="bg-white dark:bg-[#131B2E] p-4 rounded-3xl border border-slate-100 dark:border-[#1F293D] shadow-sm">
              <span className="text-xs font-bold text-emerald-500">الطلبات المنفذة</span>
              <div className="text-2xl font-black text-emerald-600 font-mono mt-1">{totalOrdersAll}</div>
            </div>
            <div className="bg-white dark:bg-[#131B2E] p-4 rounded-3xl border border-slate-100 dark:border-[#1F293D] shadow-sm">
              <span className="text-xs font-bold text-brand-500">فريق الإدارة</span>
              <div className="text-2xl font-black text-brand-600 font-mono mt-1">{totalAdmins}</div>
            </div>
          </div>

          {/* SEARCH & FILTERS */}
          <div className="bg-white dark:bg-[#131B2E] rounded-3xl p-4 border border-slate-100 dark:border-[#1F293D] shadow-sm flex flex-col md:flex-row items-center justify-between gap-3">
            <div className="relative w-full md:w-80">
              <span className="absolute inset-y-0 right-3.5 flex items-center pointer-events-none text-slate-400">
                <Icon name="Search" size={16} />
              </span>
              <input
                type="text"
                placeholder="بحث بالاسم، البريد أو الهاتف..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full bg-[#F6F7FB] dark:bg-[#0B0F19] text-xs font-medium text-slate-800 dark:text-slate-200 placeholder-slate-400 pl-4 pr-10 py-2.5 rounded-2xl border border-transparent focus:border-brand-500/30 focus:outline-none"
              />
            </div>

            <select
              value={roleFilter}
              onChange={(e) => setRoleFilter(e.target.value)}
              className="bg-[#F6F7FB] dark:bg-[#0B0F19] text-xs font-semibold text-slate-700 dark:text-slate-300 py-2.5 px-3.5 rounded-2xl border border-slate-100 dark:border-slate-800 focus:outline-none cursor-pointer w-full md:w-auto"
            >
              <option value="all">كل الأدوار</option>
              <option value="customer">العملاء فقط</option>
              <option value="admin">المدراء والمشرفين</option>
            </select>
          </div>

          {/* USERS TABLE */}
          <div className="bg-white dark:bg-[#131B2E] rounded-3xl border border-slate-100 dark:border-[#1F293D] shadow-soft overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-right text-xs">
                <thead>
                  <tr className="border-b border-slate-100 dark:border-slate-800 text-slate-400 font-bold bg-slate-50/50 dark:bg-slate-900/20">
                    <th className="py-4 pr-5">المستخدم</th>
                    <th className="py-4">رقم الهاتف</th>
                    <th className="py-4">الدور</th>
                    <th className="py-4">الطلبات</th>
                    <th className="py-4">إجمالي المشتريات</th>
                    <th className="py-4">تاريخ التسجيل</th>
                    <th className="py-4 pl-5 text-left">الحالة</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-50 dark:divide-slate-800/60">
                  {filteredCustomers.length === 0 ? (
                    <tr>
                      <td colSpan="7" className="py-12 text-center text-slate-400 font-medium">
                        لا يوجد مستخدمون مطابقون لمعايير البحث
                      </td>
                    </tr>
                  ) : (
                    filteredCustomers.map((user) => {
                      const initials = user.name.split(" ").map(n => n[0]).slice(0, 2).join("");
                      const isAdmin = user.role === "admin";
                      const isVip = user.is_vip || (user.total_spent > 5000);

                      return (
                        <tr key={user.id} className="hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition-colors">
                          <td className="py-3.5 pr-5">
                            <div className="flex items-center gap-3">
                              <div className={`w-10 h-10 rounded-2xl flex items-center justify-center font-bold text-xs flex-shrink-0 ${
                                isAdmin
                                  ? "bg-brand-500 text-white shadow-soft"
                                  : "bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300"
                              }`}>
                                {initials}
                              </div>
                              <div>
                                <div className="flex items-center gap-2">
                                  <span className="font-bold text-slate-800 dark:text-slate-100">{user.name}</span>
                                  {isVip && (
                                    <span className="px-2 py-0.5 rounded-full text-[10px] font-black bg-amber-50 dark:bg-amber-950/40 text-amber-600 border border-amber-200">
                                      VIP
                                    </span>
                                  )}
                                </div>
                                <span className="text-[11px] text-slate-400 block">{user.email}</span>
                              </div>
                            </div>
                          </td>

                          <td className="py-3.5 font-mono text-slate-600 dark:text-slate-300">
                            {user.phone || "غير محدد"}
                          </td>

                          <td className="py-3.5">
                            <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-xl text-[11px] font-bold ${
                              isAdmin
                                ? "bg-brand-50 dark:bg-brand-950/40 text-brand-600 dark:text-brand-400 border border-brand-100"
                                : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300"
                            }`}>
                              <Icon name={isAdmin ? "Shield" : "Users"} size={13} />
                              {user.roleLabel || (isAdmin ? "مدير المتجر" : "عميل")}
                            </span>
                          </td>

                          <td className="py-3.5 font-mono font-bold text-slate-800 dark:text-slate-200">
                            {user.orders_count || 0}
                          </td>

                          <td className="py-3.5 font-mono font-bold text-slate-900 dark:text-slate-100">
                            {(user.total_spent || 0).toLocaleString()} <span className="text-[10px] font-sans text-slate-400">ر.س</span>
                          </td>

                          <td className="py-3.5 text-slate-400 text-[11px]">
                            {user.register_date || "2026-10-01"}
                          </td>

                          <td className="py-3.5 pl-5 text-left">
                            <button
                              onClick={() => handleToggleUserStatus(user.id)}
                              className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-2xl text-[11px] font-bold transition-all ${
                                user.is_active !== false
                                  ? "bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 border border-emerald-200 dark:border-emerald-800/40"
                                  : "bg-rose-50 dark:bg-rose-950/40 text-rose-600 border border-rose-200 dark:border-rose-800/40"
                              }`}
                              title="انقر لتفعيل أو إيقاف الحساب"
                            >
                              <span className={`w-1.5 h-1.5 rounded-full ${user.is_active !== false ? "bg-emerald-500" : "bg-rose-500"}`}></span>
                              <span>{user.is_active !== false ? "نشط" : "موقوف"}</span>
                            </button>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 3. STORE SETTINGS VIEW (الإعدادات العامة والربط)
    // ==========================================
    const SettingsView = ({ settings, setSettings, isLiveMode, connectionStatus, showToast }) => {
      const [formData, setFormData] = useState({ ...settings });
      const [isSaving, setIsSaving] = useState(false);

      const handleChange = (field, value) => {
        setFormData(prev => ({ ...prev, [field]: value }));
      };

      const handleSave = async (e) => {
        e.preventDefault();
        setIsSaving(true);
        try {
          setSettings(formData);
          localStorage.setItem('barakat_store_settings', JSON.stringify(formData));
          if (isLiveMode) {
            try {
              await BarakatApi.updateSettings(formData);
            } catch (err) {
              console.warn("Backend settings update:", err.message);
            }
          }
          showToast("تم حفظ جميع إعدادات المتجر بنجاح! 🟢");
        } catch (err) {
          showToast("حدث خطأ أثناء حفظ الإعدادات", "error");
        } finally {
          setIsSaving(false);
        }
      };

      return (
        <form onSubmit={handleSave} className="space-y-6 animate-fadeIn">
          {/* HEADER */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl sm:text-3xl font-black text-slate-800 dark:text-slate-100 tracking-tight flex items-center gap-2.5">
                <span className="p-2 rounded-2xl bg-brand-500 text-white shadow-soft">
                  <Icon name="Settings" size={24} />
                </span>
                إعدادات المتجر العامة والربط
              </h2>
              <p className="text-xs text-slate-400 font-medium mt-1">
                تخصيص هوية المتجر، بوابات الدفع، خيارات الشحن، والاتصال بالخادم المباشر
              </p>
            </div>

            <button
              type="submit"
              disabled={isSaving}
              className="inline-flex items-center gap-2 px-6 py-2.5 rounded-2xl text-xs font-bold text-white bg-brand-500 hover:bg-brand-600 transition-all shadow-soft hover:shadow-soft-hover disabled:opacity-50"

    const OrdersView = ({ orders, onSelectOrder }) => {
      const [searchQuery, setSearchQuery] = useState("");
      const [statusFilter, setStatusFilter] = useState("all");

      const filtered = useMemo(() => {
        return orders.filter(o => {
          const matchSearch = o.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
            o.customer.toLowerCase().includes(searchQuery.toLowerCase());
          const matchStatus = statusFilter === "all" || o.status === statusFilter;
          return matchSearch && matchStatus;
        });
      }, [orders, searchQuery, statusFilter]);

      const statusCounts = useMemo(() => {
        return {
          all: orders.length,
          processing: orders.filter(o => o.status === "processing").length,
          shipped: orders.filter(o => o.status === "shipped").length,
          delivered: orders.filter(o => o.status === "delivered").length,
          cancelled: orders.filter(o => o.status === "cancelled").length,
        };
      }, [orders]);

      return (
        <div className="space-y-6 animate-fadeIn">
          {/* HEADER */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">

                  <Icon name="ShoppingCart" size={24} />

                إدارة ومتابعة الطلبات

          {/* STATUS TABS */}

            {[
              { id: "all", label: "كل الطلبات", count: statusCounts.all },
              { id: "processing", label: "قيد المعالجة", count: statusCounts.processing },
              { id: "shipped", label: "قيد الشحن", count: statusCounts.shipped },
              { id: "delivered", label: "مكتملة", count: statusCounts.delivered },
              { id: "cancelled", label: "ملغية", count: statusCounts.cancelled },
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setStatusFilter(tab.id)}
                className={`px-4 py-2 rounded-2xl text-xs font-bold transition-all flex items-center gap-2 ${
                  statusFilter === tab.id

                  statusFilter === tab.id ? "bg-white/20 text-white" : "bg-slate-100 dark:bg-slate-800 text-slate-500"
                }`}>
                  {tab.count}

              </button>
            ))}

                      </td>
                    </tr>
                  ) : (
                    filtered.map((order) => {
                      const status = STATUS_CONFIG[order.status] || STATUS_CONFIG.pending;
                      return (
                        <tr
                          key={order.id}
                          className="hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition-colors cursor-pointer"
                          onClick={() => onSelectOrder(order)}
                        >
                          <td className="py-3.5 pr-5 font-mono font-bold text-slate-800 dark:text-slate-100">

    // ==========================================
    // Main App Component
    // ==========================================
    function App() {

      const [darkMode, setDarkMode] = useState(false);
      // Sidebar states
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);

      const [contentSubmenuOpen, setContentSubmenuOpen] = useState(false);

      // API integration states
      const [apiUrl, setApiUrl] = useState(BarakatApi.getBaseUrl());
      const [connectionStatus, setConnectionStatus] = useState("connecting"); // 'connected' | 'demo' | 'connecting' | 'error'
      const [isLiveMode, setIsLiveMode] = useState(false);
      const [apiModalOpen, setApiModalOpen] = useState(false);
      const [apiLoading, setApiLoading] = useState(false);
      const [apiError, setApiError] = useState(null);
      const [toast, setToast] = useState(null);
      const [isUpdatingOrder, setIsUpdatingOrder] = useState(false);

      // Real live data states
      const [orders, setOrders] = useState(INITIAL_ORDERS);
      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [customers, setCustomers] = useState(INITIAL_CUSTOMERS);
      const [categories, setCategories] = useState(INITIAL_CATEGORIES);
      const [settings, setSettings] = useState(INITIAL_SETTINGS);
      const [discounts, setDiscounts] = useState(INITIAL_DISCOUNTS);
      const [stats, setStats] = useState({
        total_sales: 19253,
        total_orders: 6,
        total_customers: 6,
        total_products: 17,
        active_customers: 1,
        new_customers: 1
      });

      const showToast = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Fetch live data from Laravel Backend
      const fetchLiveDashboardAndOrders = async (showSuccessToast = false) => {
        setApiLoading(true);
        setApiError(null);
        try {
          const [dashRes, ordersRes] = await Promise.all([
            BarakatApi.getDashboard(),
            BarakatApi.getOrders('all')
          ]);

          if (dashRes.data) {
            setStats(prev => ({ ...prev, ...dashRes.data }));
          }

          if (ordersRes.data?.data) {
            const formatted = ordersRes.data.data.map(formatApiOrder);
            setOrders(formatted);
          }

          // Fetch products from live server
          try {
            const prodRes = await BarakatApi.getProducts();
            const pList = prodRes.data?.data || prodRes.data;
            if (Array.isArray(pList) && pList.length > 0) {
              setProducts(pList.map(p => ({
                id: p.id,
                name: p.name,
                category: p.category?.name || "عام",
                price: parseFloat(p.price) || 0,
                old_price: p.old_price ? parseFloat(p.old_price) : null,
                stock: p.stock ?? 10,
                is_active: p.is_active !== undefined ? Boolean(p.is_active) : true,
                rating: p.rating || 4.8,
                reviews_count: p.reviews_count || 12,
                image: p.image || "https://images.unsplash.com/photo-1566174049881-81001826583c?w=500"
              })));
            }
          } catch (e) {
            console.log("Using initial products fallback");
          }

          // Fetch customers from live server
          try {
            const custRes = await BarakatApi.getCustomers();
            if (custRes.data && Array.isArray(custRes.data)) {
              setCustomers(custRes.data);
            }
          } catch (e) {
            console.log("Using initial customers fallback");
          }

          // Fetch settings from live server
          try {
            const setRes = await BarakatApi.getSettings();
            if (setRes.data) {
              setSettings(prev => ({ ...prev, ...setRes.data }));
            }
          } catch (e) {
            console.log("Using initial settings fallback");
          }

          setConnectionStatus("connected");
          setIsLiveMode(true);
          if (showSuccessToast) {
            showToast("تم تحديث البيانات بنجاح من الخادم المباشر 🟢");
          }
        } catch (err) {
          console.warn("API fetch error:", err);
          setApiError(err.message);
          setConnectionStatus("demo");
          setIsLiveMode(false);
        } finally {
          setApiLoading(false);
        }
      };

      // Auto-connect or auto-login on initial mount
      useEffect(() => {
        const initApi = async () => {
          const token = BarakatApi.getToken();
          if (token) {
            await fetchLiveDashboardAndOrders(false);
          } else {
            // Attempt auto-login with default dev admin credentials
            try {
              await BarakatApi.login("admin@store.test", "password");
              await fetchLiveDashboardAndOrders(false);
            } catch (err) {
              console.log("Auto-login fallback to demo mode:", err.message);
              setConnectionStatus("demo");

        };
        initApi();
      }, []);

      const handleLogin = async (email, password) => {
        setApiLoading(true);
        setApiError(null);
        try {
          BarakatApi.setBaseUrl(apiUrl);
          await BarakatApi.login(email, password);
          await fetchLiveDashboardAndOrders(false);
          setApiModalOpen(false);
          showToast("تم تسجيل الدخول والربط بالخادم بنجاح! 🟢");

          total_orders: 6,
          total_customers: 6,
          total_products: 17,
          active_customers: 1,
          new_customers: 1

        showToast("تم التبديل إلى وضع المعاينة التجريبي 🟡");

        showToast("تم تسجيل الخروج");

      const handleUpdateOrderStatus = async (order, newStatus) => {
        setIsUpdatingOrder(true);
        try {
          if (isLiveMode && order.rawId) {
            await BarakatApi.updateOrderStatus(order.rawId, newStatus);
            // Refresh orders from server
            const ordersRes = await BarakatApi.getOrders('all');
            if (ordersRes.data?.data) {
              setOrders(ordersRes.data.data.map(formatApiOrder));
            }
          } else {
            // Update local state in demo mode
            setOrders(prev => prev.map(o => o.id === order.id ? { ...o, status: newStatus, statusLabel: STATUS_CONFIG[newStatus]?.label || newStatus } : o));

          showToast(`تم تحديث حالة الطلب ${order.id} بنجاح! 🟢`);
        } catch (err) {

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
